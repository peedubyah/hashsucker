services:
  media-search:
    build:
      context: ./media-search
      dockerfile: Dockerfile
    image: media-search:local
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      REQUESTS_ROOT: /requests
      DISCOVERY_DB: /data/discovery-cache.db
      CONTROL_PLANE_DB: /data/control-plane.db
      TORBOX_API_KEY: ${TORBOX_API_KEY:?Set TORBOX_API_KEY in .env}
      REALDEBRID_API_KEY: ${REALDEBRID_API_KEY:-}
      COMET_MANIFEST_URL: ${COMET_MANIFEST_URL:-}
      TORZNAB_URLS: ${TORZNAB_URLS:-}
    ports:
      - "${MEDIA_SEARCH_BIND_ADDRESS:-127.0.0.1}:${MEDIA_SEARCH_PORT:-3000}:3000"
    volumes:
      - /home/patrick/hashsucker-data/discovery:/data
      - ${REQUESTS_HOST_PATH:?Set REQUESTS_HOST_PATH in .env}:/requests
    group_add:
      - "${MEDIA_SEARCH_QUEUE_GID:-100}"
    security_opt:
      - no-new-privileges:true

  torbox-importer:
    build:
      context: ./torbox-importer
    image: torbox-importer:local
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    environment:
      TORBOX_API_KEY: ${TORBOX_API_KEY:?Set TORBOX_API_KEY in .env}
      TORBOX_API_URL: ${TORBOX_API_URL:-https://api.torbox.app/v1/api}
      TORBOX_DB: /config/state/torbox-importer.db
      POLL_INTERVAL: "${POLL_INTERVAL:-10}"
      RADARR_URL: ${RADARR_URL:?Set RADARR_URL in .env}
      RADARR_API_KEY: ${RADARR_API_KEY:?Set RADARR_API_KEY in .env}
      RADARR_ROOT_FOLDER: "${RADARR_ROOT_FOLDER:-/data/Movies}"
      RADARR_PROFILE_HD: "${RADARR_PROFILE_HD:-4}"
      RADARR_PROFILE_4K_WEB: "${RADARR_PROFILE_4K_WEB:-7}"
      RADARR_PROFILE_4K_BLU: "${RADARR_PROFILE_4K_BLU:-8}"
      SONARR_URL: ${SONARR_URL:?Set SONARR_URL in .env}
      SONARR_API_KEY: ${SONARR_API_KEY:?Set SONARR_API_KEY in .env}
    volumes:
      - ${TORBOX_IMPORTER_HOST_PATH:?Set TORBOX_IMPORTER_HOST_PATH in .env}:/config
      - ${REQUESTS_HOST_PATH:?Set REQUESTS_HOST_PATH in .env}:/requests
      - ${DOWNLOADS_HOST_PATH:?Set DOWNLOADS_HOST_PATH in .env}:/downloads
    security_opt:
      - no-new-privileges:true

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      EDGE_PORT: "${EDGE_PORT:-8080}"
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_PORT:-8080}:${EDGE_PORT:-8080}"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - media-search
    security_opt:
      - no-new-privileges:true

volumes:
  discovery-data:
