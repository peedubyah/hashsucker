# Image policy (packaging tranche): every built service has BOTH an
# `image:` reference and a `build:` section.
#   Normal users:  docker compose pull && docker compose up -d
#                  (consumes prebuilt GHCR images, no toolchain needed)
#   Developers:    docker compose build / up --build (local sources)
# `up -d` without --build uses the pulled image when present.
# HASHSUCKER_VERSION pins the release (a git tag like v1.2.3, a SHA, or
# `latest`); HASHSUCKER_REGISTRY overrides the registry host.
services:
  media-search:
    image: ${HASHSUCKER_REGISTRY:-ghcr.io/peedubyah}/hashsucker-media-search:${HASHSUCKER_VERSION:-latest}
    build:
      context: ./media-search
      dockerfile: Dockerfile
      args:
        REVISION: ${HASHSUCKER_REVISION:-dev}
        VERSION: ${HASHSUCKER_VERSION:-latest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      REQUESTS_ROOT: /requests
      DISCOVERY_DB: /data/discovery-cache.db
      CONTROL_PLANE_DB: /data/control-plane.db
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      REALDEBRID_API_KEY: ${REALDEBRID_API_KEY:-}
      # TorBox API base override (primarily isolated testing). The runtime
      # provider AND the readiness probe both honor it — a typo here must
      # fail loudly in diagnostics, never report healthy against the
      # default endpoint while the runtime uses the broken one.
      TORBOX_API_URL: ${TORBOX_API_URL:-https://api.torbox.app/v1/api}
      COMET_TORBOX_MANIFEST_URL: ${COMET_TORBOX_MANIFEST_URL:-}
      COMET_REALDEBRID_MANIFEST_URL: ${COMET_REALDEBRID_MANIFEST_URL:-}
      TORZNAB_URLS: ${TORZNAB_URLS:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      STRM_OUTPUT_PATH: "${STRM_OUTPUT_PATH:-/strm}"
      RESOLVER_BASE_URL: "${HASHSUCKER_BASE_URL:-http://localhost:8080}"
      # Share-group mediation for the queue/STRM entrypoint repair
      # (mirrors group_add below; entrypoints cannot see group_add).
      MEDIA_SEARCH_QUEUE_GID: ${MEDIA_SEARCH_QUEUE_GID:-100}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_MEDIA_ROOT: ${JELLYFIN_MEDIA_ROOT:-}
      RESOLVER_PROFILE: ${RESOLVER_PROFILE:-0}
      SEERR_WEBHOOK_TOKEN: ${SEERR_WEBHOOK_TOKEN:-}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_MOVIES_SECTION_ID: ${PLEX_MOVIES_SECTION_ID:-}
      PLEX_TV_SECTION_ID: ${PLEX_TV_SECTION_ID:-}
      PLEX_MOVIES_ROOT: ${PLEX_MOVIES_ROOT:-}
      PLEX_TV_ROOT: ${PLEX_TV_ROOT:-}
      CORPUS_MAINTENANCE: ${CORPUS_MAINTENANCE:-}
      CORPUS_AUTO_BOOTSTRAP: ${CORPUS_AUTO_BOOTSTRAP:-}
      CORPUS_UPDATE_INTERVAL_HOURS: ${CORPUS_UPDATE_INTERVAL_HOURS:-}
      CORPUS_DMM_REPO: ${CORPUS_DMM_REPO:-}
      CORPUS_GITHUB_TOKEN: ${CORPUS_GITHUB_TOKEN:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      ARR_SYNC_INTERVAL_HOURS: ${ARR_SYNC_INTERVAL_HOURS:-}
      ANTICIPATION_PREPARE_DAYS: ${ANTICIPATION_PREPARE_DAYS:-}
      ANTICIPATION_PUBLISH_DAYS: ${ANTICIPATION_PUBLISH_DAYS:-}
      # Owned-storage root for permanent promotion output (promotion
      # tranche). Unset = promotion API refuses, everything else
      # unchanged. Deliberately NOT derived from HASHSUCKER_MEDIA_PATH:
      # that root is STRM publication only and must never silently
      # become a gigabyte byte-storage destination.
      HASHSUCKER_PERMANENT_PATH: ${HASHSUCKER_PERMANENT_PATH:-}
      # Staging/output root for generic download intents
      # (download-intent tranche). Unset = download API refuses,
      # everything else unchanged. HashSucker-owned staging only:
      # <root>/movies/ and <root>/tv/ for external importers.
      HASHSUCKER_DOWNLOAD_PATH: ${HASHSUCKER_DOWNLOAD_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MEDIA_SEARCH_BIND_ADDRESS:-127.0.0.1}:${MEDIA_SEARCH_PORT:-3000}:3000"
    volumes:
      # Host-path contract: two roots cover the normal case; explicit
      # HASHSUCKER_*_HOST_PATH overrides cover separate storage
      # destinations. Precedence per mount:
      #   explicit HASHSUCKER_*_HOST_PATH > legacy alias (when retained)
      #   > HASHSUCKER_DATA_PATH / HASHSUCKER_MEDIA_PATH-derived default
      #   > repo-local fallback.
      #   Canonical HASHSUCKER_*_HOST_PATH variables are FINAL leaf paths:
      #   compose never appends another directory to them (a set leaf is
      #   mounted as-is). The leaf suffix in each expression belongs to
      #   the fallback branches only, so roots and legacy aliases keep
      #   working while leaf-style legacy values must be shadowed by an
      #   explicit pin (leaf legacy values double-append otherwise).
      #   HASHSUCKER_DATA_PATH  private state: discovery DBs, queue,
      #                         importer state
      #   HASHSUCKER_MEDIA_PATH consumer-visible media: STRM files
      #                         (this is the path Plex/Jellyfin must see)
      # Generic download staging (./hy4-downloads) and owned permanent
      # output (./hy4-permanent) are deliberately NOT derived from the
      # two roots: they are separate storage decisions (byte destinations),
      # not state and not STRM publication.
      # hy4-cache stays a named volume: container-managed cache bytes with
      # no host-sharing need (avoids bind copy-up surprises).
      - ${HASHSUCKER_DISCOVERY_HOST_PATH:-${HASHSUCKER_DATA_PATH:-${DISCOVERY_HOST_PATH:-./hy4-data}}/discovery}:/data
      - ${HASHSUCKER_QUEUE_HOST_PATH:-${HASHSUCKER_DATA_PATH:-${REQUESTS_HOST_PATH:-./hy4-data}}/queue}:/requests
      - ${HASHSUCKER_STRM_HOST_PATH:-${HASHSUCKER_MEDIA_PATH:-${STRM_HOST_PATH:-./hy4-media}}/strm}:/strm
      # Owned media root (promotion output). Always mounted so enabling
      # promotion is one env var; empty and inert until
      # HASHSUCKER_PERMANENT_PATH points here.
      - ${HASHSUCKER_PERMANENT_HOST_PATH:-${PERMANENT_HOST_PATH:-./hy4-permanent}}:/permanent
      # Download staging root (generic download intents). Same deal:
      # mounted always, inert until HASHSUCKER_DOWNLOAD_PATH is set.
      - ${HASHSUCKER_DOWNLOAD_HOST_PATH:-${DOWNLOAD_HOST_PATH:-./hy4-downloads}}:/download
    group_add:
      - "${MEDIA_SEARCH_QUEUE_GID:-100}"
    security_opt:
      - no-new-privileges:true

  torbox-importer:
    image: ${HASHSUCKER_REGISTRY:-ghcr.io/peedubyah}/hashsucker-torbox-importer:${HASHSUCKER_VERSION:-latest}
    build:
      context: ./torbox-importer
      args:
        REVISION: ${HASHSUCKER_REVISION:-dev}
        VERSION: ${HASHSUCKER_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Runtime identity for the entrypoint privilege drop (Unraid: 99/100).
      # The container starts as root to repair host bind ownership, then
      # the entrypoint drops to this user — identical to the old
      # `user:` stanza, plus first-boot repair.
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      # Share-group mediation for the queue/STRM entrypoint repair
      # (mirrors group_add below; entrypoints cannot see group_add).
      MEDIA_SEARCH_QUEUE_GID: ${MEDIA_SEARCH_QUEUE_GID:-100}
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      TORBOX_API_URL: ${TORBOX_API_URL:-https://api.torbox.app/v1/api}
      TORBOX_DB: /config/state/torbox-importer.db
      POLL_INTERVAL: "${POLL_INTERVAL:-10}"
      STRM_OUTPUT_PATH: "${STRM_OUTPUT_PATH:-/strm}"
      HASHSUCKER_BASE_URL: "${HASHSUCKER_BASE_URL:-http://media-search:3000}"
      # Arr endpoints are OPTIONAL for boot: the worker idles without them
      # (queue polling + TorBox inventory need only the TorBox key) and the
      # import scripts fail fast and loudly per-job when Arr is absent.
      # A TorBox-only instance without Arr boots and idles cleanly.
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      RADARR_ROOT_FOLDER: "${RADARR_ROOT_FOLDER:-/data/Movies}"
      RADARR_PROFILE_HD: "${RADARR_PROFILE_HD:-4}"
      RADARR_PROFILE_4K_WEB: "${RADARR_PROFILE_4K_WEB:-7}"
      RADARR_PROFILE_4K_BLU: "${RADARR_PROFILE_4K_BLU:-8}"
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
    volumes:
      - ${HASHSUCKER_TORBOX_IMPORTER_HOST_PATH:-${HASHSUCKER_DATA_PATH:-${TORBOX_IMPORTER_HOST_PATH:-./hy4-data}}/torbox-importer}:/config
      - ${HASHSUCKER_QUEUE_HOST_PATH:-${HASHSUCKER_DATA_PATH:-${REQUESTS_HOST_PATH:-./hy4-data}}/queue}:/requests
      - ${HASHSUCKER_TORBOX_IMPORTER_DOWNLOADS_HOST_PATH:-${HASHSUCKER_DATA_PATH:-${DOWNLOADS_HOST_PATH:-./hy4-data}}/downloads}:/downloads
      - ${HASHSUCKER_STRM_HOST_PATH:-${HASHSUCKER_MEDIA_PATH:-${STRM_HOST_PATH:-./hy4-media}}/strm}:/strm
    # Same queue-group mediation as media-search: on group-mediated hosts
    # (Unraid users group) both queue writers share access without
    # fighting over ownership.
    group_add:
      - "${MEDIA_SEARCH_QUEUE_GID:-100}"
    security_opt:
      - no-new-privileges:true

  edge:
    image: ${HASHSUCKER_REGISTRY:-ghcr.io/peedubyah}/hashsucker-edge:${HASHSUCKER_VERSION:-latest}
    build:
      context: ./edge
      args:
        REVISION: ${HASHSUCKER_REVISION:-dev}
        VERSION: ${HASHSUCKER_VERSION:-latest}
    restart: unless-stopped
    environment:
      EDGE_PORT: "${EDGE_PORT:-8080}"
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_PORT:-8080}:${EDGE_PORT:-8080}"
    depends_on:
      - media-search
    security_opt:
      - no-new-privileges:true

  # P3: the Rust data plane. Reads the S-1 control endpoint over the
  # internal compose network (CONTROL_URL below) and serves two routes:
  #   GET /files/:tfId  per-request S-1 fetch -> per-request AppState
  #   GET /metrics      process-aggregate counters
  #
  # The Slice 4 cache lives on a named volume (hy4-cache) so docker
  # compose restart/recreate preserves durable bytes -- proof C in the P3
  # ladder is that a fresh container reuses the same on-disk cache path
  # without any manual code injection.
  #
  # S-1 reachability: CONTROL_URL is the in-network hostname of the north
  # service. Port 3000 is the internal port; no auth, matching the rest
  # of /api/control-plane/* (see S1-CONTROL-CONTRACT.md).
  #
  # Compatibility: the service is also reachable as the legacy hostname
  # `hy4-data-plane` via the compose network alias below, so existing
  # operator workflows and scripts that reference the old name continue
  # to resolve.
  data-plane:
    image: ${HASHSUCKER_REGISTRY:-ghcr.io/peedubyah}/hashsucker-data-plane:${HASHSUCKER_VERSION:-latest}
    build:
      context: ./data-plane
      dockerfile: Dockerfile
      args:
        REVISION: ${HASHSUCKER_REVISION:-dev}
        VERSION: ${HASHSUCKER_VERSION:-latest}
    restart: unless-stopped
    hostname: data-plane
    environment:
      LISTEN: "0.0.0.0:3001"
      CONTROL_URL: "http://media-search:3000/api"
      CACHE_ROOT: "/data/cache"
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      REALDEBRID_API_KEY: ${REALDEBRID_API_KEY:-}
      # Test-only per-TorrentFile provider allowlist (data-plane P13-A).
      # Empty (default) = disabled. NEVER set in production.
      DATA_PLANE_FORCE_PROVIDER: ${DATA_PLANE_FORCE_PROVIDER:-}
      # DIAGNOSTIC: disable prefetch so demand reads are not coalesced into prefetch fills
      PREFETCH_ENABLED: "0"
    depends_on:
      - media-search
    volumes:
      - hy4-cache:/data
    networks:
      default:
        aliases:
          - hy4-data-plane
    security_opt:
      - no-new-privileges:true

volumes:
  hy4-cache:
