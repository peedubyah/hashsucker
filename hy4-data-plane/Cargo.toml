[package]
name = "hy4-data-plane"
version = "0.1.0"
edition = "2021"

[lib]
name = "hy4_data_plane"
path = "src/lib.rs"

# P3 binary: multi-TorrentFile /files/:tfId + /metrics. This binary owns
# startup. The serving core is in src/serve.rs (a library module, not a
# duplicate of the lab main.rs). The lab's main.rs is NOT carried over.
[[bin]]
name = "hy4-data-plane"
path = "src/main.rs"

# Dependency set is byte-identical to the donor, including the exact
# `axum = "=0.7.5"` pin. Cargo.lock pins the resolved graph.
[dependencies]
axum = "=0.7.5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
# P3 microscopic correction: physical cache key is a SHA-256 digest of a
# length-prefixed durable tuple (see src/cache.rs). `sha2` produces the
# digest; `hex` renders it as a fixed-width lowercase hex string that is
# safe as a single filesystem directory name and as an object-store key.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
