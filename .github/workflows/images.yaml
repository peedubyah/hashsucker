# Minimal image publishing (packaging tranche).
#
# Builds the three first-party services with docker/buildx and pushes to
# GHCR. No tests here (unit suites run separately, if at all); no
# provenance beyond OCI revision labels baked at build time; no secrets
# except the automatic GITHUB_TOKEN used only for registry auth.
#
# Tags:
#   - version tags (v1.2.3): `v1.2.3` + `latest`
#   - main branch pushes: `latest` + `sha-<short>`
# Platforms: amd64 + arm64 (all bases and builds are arch-clean:
#   pinned Alpine/Node/Rust toolchains, source-compiled native modules).
# Users pin via HASHSUCKER_VERSION in .env (a tag, a SHA tag, or latest).

name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: peedubyah

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [media-search, data-plane, torbox-importer, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/hashsucker-${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
