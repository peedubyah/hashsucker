# Image delivery channels (CI/CD channels tranche).
#
# Three separated channels, one workflow:
#   pull_request  -> validate only: amd64 builds for all four services,
#                    nothing published (arm64 QEMU stays out of PRs).
#   push to main  -> continuous: amd64 only, publishes :main + :sha-<short>.
#                    Never touches :latest. Stale runs cancel.
#   push v* tag   -> release: amd64 + arm64, immutable exact version +
#                    semver aliases (0.1.1, 0.1) + :latest. Always completes.
#
# No per-service path filtering (deliberate): :sha-<commit> tags must be
# complete sets, and native amd64 builds are cheap enough that skipping
# buys risk instead of time. arm64 stays release-only (QEMU cost) and
# published-but-field-unproven.
#
# Secrets: only the automatic GITHUB_TOKEN (registry auth). No provider,
# Arr, Seerr, or Prowlarr credentials anywhere in this file.

name: images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Obsolete-run cancellation lives HERE (run granularity), never inside a
# matrix job: per-job concurrency groups coincided with schedule-time
# cancellation of matrix legs across three runs (victim sets rotated;
# already-started jobs always survived), while runs without it went
# green. A newer push to the same ref cancels the whole obsolete run;
# tags and PRs evaluate in isolated groups.
concurrency:
  group: hashsucker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: peedubyah

jobs:
  # PRs: prove the images still build. No registry writes.
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [media-search, data-plane, torbox-importer, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: false
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=pr-${{ github.event.pull_request.number || github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous dogfood channel: every main commit, amd64 only.
  # (Obsolete-run cancellation is workflow-level above, never per-job:
  # per-job groups killed matrix legs at schedule time. Verified green.)
  publish-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [media-search, data-plane, torbox-importer, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/hashsucker-${{ matrix.service }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stable release channel: version tags only, both architectures.
  # Runs to completion (no cancellation): releases are immutable.
  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [media-search, data-plane, torbox-importer, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/hashsucker-${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
