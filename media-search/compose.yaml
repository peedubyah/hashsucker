services:
  media-search:
    build: .
    image: media-search:local
    container_name: media-search
    restart: unless-stopped
    environment:
      PORT: "3000"
      REQUESTS_ROOT: /requests
      TORBOX_API_KEY: ${TORBOX_API_KEY:?Set TORBOX_API_KEY in .env}
      STREMIO_ADDON_MANIFEST_URL: ${STREMIO_ADDON_MANIFEST_URL:?Set STREMIO_ADDON_MANIFEST_URL in .env}
    ports:
      - "${MEDIA_SEARCH_PORT:-3000}:3000"
    volumes:
      - ${REQUESTS_HOST_PATH:-/mnt/database/appdata/media-request-queue}:/requests
    group_add:
      - "100"
    security_opt:
      - no-new-privileges:true
